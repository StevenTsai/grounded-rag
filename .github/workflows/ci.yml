# GroundedRAG 最小 CI：跑单元测试 + 静态检查。
# 仓库主站为 Gitee（https://gitee.com/miniclaw27/grounded-rag），
# 本工作流面向规划中的 GitHub 镜像；Gitee Go 为独立服务，可另配等价流水线。
name: CI

on:
  push:
    branches: [master, feature-*]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --cov=groundedrag --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Lint
        run: ruff check .
