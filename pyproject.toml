[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundedrag"
version = "1.0.0"
description = "GroundedRAG —— 轻量开源 RAG 框架：以「声明级校验门」可复现地减少无证据输出，让 LLM 回答「有据可依、无据可拒」。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GroundedRAG Team" }]
keywords = [
    "rag",
    "llm",
    "retrieval",
    "grounded",
    "guardrail",
    "evidence",
    "medical",
    "trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心运行时依赖仅 jieba（MIT）：
# 中文分词是 BM25 / 实体增强 / 证据要素比对的前提，必须为核心依赖而非可选。
# bm25.py 在 jieba 缺失时提供 CJK char-bigram 回退，绝不回退到对中文无效的 split()。
dependencies = [
    "jieba>=0.42.1",
]

[project.optional-dependencies]
# demo 可视化（Gradio 及其传递依赖是一棵独立依赖树，许可证见 THIRD_PARTY_NOTICES.md）
demo = [
    "gradio>=4.44.0",
]
# 开发 / 测试
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pip-licenses>=4.0",
]

[project.urls]
Homepage = "https://gitee.com/miniclaw27/grounded-rag"
Repository = "https://gitee.com/miniclaw27/grounded-rag"
BugTracker = "https://gitee.com/miniclaw27/grounded-rag/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundedrag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -ra"

[tool.coverage.run]
source = ["groundedrag"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 显式圈定规则集：E4/E7/E9 = pycodestyle 关键子集、F = pyflakes、I = isort、
# W = pycodestyle 空白。刻意不引入 UP（现代 typing 改写）与 E5（行长）——
# 代码库统一使用 typing.List/Dict 风格 + 中文字符串，二者会引入大面积噪声改写。
select = ["E4", "E7", "E9", "F", "I", "W"]
